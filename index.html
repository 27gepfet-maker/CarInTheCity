<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Driving Simulator - Meta Quest 3 Ready</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- A-Frame VR Core Library over Secure HTTPS -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d1b2a;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Scene canvas fix to prevent black screen overlay hiding */
    a-scene {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }

    /* On-Screen HUD Dashboard */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: rgba(10, 15, 25, 0.88);
      border: 2px solid rgba(0, 230, 255, 0.6);
      border-radius: 12px;
      padding: 15px 20px;
      color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 230, 255, 0.2);
      backdrop-filter: blur(8px);
      min-width: 180px;
      pointer-events: auto;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #88a0c0;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
      margin-bottom: 10px;
    }

    .stat-value.gear {
      color: #ffcc00;
    }

    .controls-hint {
      font-size: 11px;
      color: #a0b5d0;
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      margin-top: 5px;
    }

    .controls-hint strong {
      color: #00ffcc;
    }

    #reset-btn {
      margin-top: 10px;
      width: 100%;
      background: #e63946;
      border: none;
      color: white;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      box-shadow: 0 0 8px rgba(230, 57, 70, 0.4);
      transition: all 0.2s ease;
    }

    #reset-btn:hover {
      background: #ff4d5e;
    }

    /* On-Screen Touch Buttons */
    #touch-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      gap: 12px;
      flex-direction: column;
      pointer-events: auto;
    }

    .touch-btn {
      width: 65px;
      height: 65px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }

    .touch-btn:active {
      background: rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- On-Screen Dashboard -->
  <div id="hud">
    <div class="stat-label">SPEED</div>
    <div class="stat-value"><span id="speed-display">0</span> <span style="font-size: 14px;">MPH</span></div>
    
    <div class="stat-label">GEAR / MODE</div>
    <div class="stat-value gear" id="gear-display">PARK</div>

    <div class="stat-label">STEERING ANGLE</div>
    <div class="stat-value" id="steering-display" style="font-size: 18px; margin-bottom: 0;">0°</div>

    <button id="reset-btn" onclick="resetCarPosition()">Reset Position</button>

    <div class="controls-hint">
      <strong>VR Quest 3 Controls:</strong><br>
      • <strong>Right Trigger / Stick UP:</strong> GAS<br>
      • <strong>Left Trigger / Stick DOWN:</strong> BRAKE / REVERSE<br>
      • <strong>Grip Wheels (L/R):</strong> Grab Steering Wheel & Turn<br><br>
      <strong>Keyboard Controls:</strong><br>
      • <strong>W / Up:</strong> Gas | <strong>S / Down:</strong> Reverse<br>
      • <strong>A / D:</strong> Turn | <strong>Mouse Drag:</strong> Steering Wheel
    </div>
  </div>

  <div id="touch-controls">
    <div class="touch-btn" id="btn-gas">GAS</div>
    <div class="touch-btn" id="btn-brake" style="border-color: #ff4d5e;">REV</div>
  </div>

  <!-- A-Frame VR Scene (embedded tag added to render canvas cleanly) -->
  <a-scene 
    embedded
    renderer="antialias: true; colorManagement: true;"
    vr-mode-ui="enabled: true"
    background="color: #0d1b2a">

    <!-- Lighting -->
    <a-entity type="ambient" color="#667788" intensity="0.8"></a-entity>
    <a-entity type="directional" position="20 40 10" color="#fffaed" intensity="1.2"></a-entity>

    <!-- Sky -->
    <a-sky color="#0a1118"></a-sky>

    <!-- Road Surface Plane -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="1000" height="1000" color="#1a222d" roughness="0.8"></a-plane>
    <a-plane position="0 0.01 0" rotation="-90 0 0" width="16" height="1000" color="#222b35" roughness="0.6"></a-plane>
    <a-plane position="-0.1 0.02 0" rotation="-90 0 0" width="0.15" height="1000" color="#ffcc00"></a-plane>
    <a-plane position="0.1 0.02 0" rotation="-90 0 0" width="0.15" height="1000" color="#ffcc00"></a-plane>

    <!-- Dynamic Buildings Container -->
    <a-entity id="city-buildings"></a-entity>

    <!-- CAR VEHICLE RIG -->
    <a-entity id="car-rig" position="0 0.5 0" driving-system>

      <!-- CAR BODY CHASSIS -->
      <a-entity id="car-body">
        <a-box position="0 0.3 0" width="2.2" height="0.6" depth="4.4" color="#d62828" material="roughness: 0.3; metalness: 0.5"></a-box>
        <a-box position="0 0.9 -0.3" width="1.9" height="0.75" depth="2.2" color="#111111" material="roughness: 0.1; metalness: 0.8; opacity: 0.9"></a-box>
        <a-box position="0 0.95 0.75" rotation="-25 0 0" width="1.85" height="0.6" depth="0.1" color="#88ccff" material="opacity: 0.5; transparent: true"></a-box>
        <a-box position="0 0.62 1.3" width="2.0" height="0.08" depth="1.6" color="#b71c1c"></a-box>
        <a-box position="-0.85 0.4 2.18" width="0.3" height="0.15" depth="0.1" color="#ffffaa" material="emissive: #ffffaa; emissiveIntensity: 2"></a-box>
        <a-box position="0.85 0.4 2.18" width="0.3" height="0.15" depth="0.1" color="#ffffaa" material="emissive: #ffffaa; emissiveIntensity: 2"></a-box>
        <a-box position="-0.85 0.4 -2.18" width="0.35" height="0.15" depth="0.1" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 1.5"></a-box>
        <a-box position="0.85 0.4 -2.18" width="0.35" height="0.15" depth="0.1" color="#ff0000" material="emissive: #ff0000; emissiveIntensity: 1.5"></a-box>
        <a-box position="0 0.75 0.45" width="1.8" height="0.35" depth="0.4" color="#1a1a1a"></a-box>
      </a-entity>

      <!-- FOUR WHEELS -->
      <a-entity id="wheel-fl-pivot" position="-1.25 0 1.3">
        <a-cylinder class="wheel-mesh" rotation="0 0 90" radius="0.4" height="0.3" color="#151515" material="roughness: 0.9">
          <a-box position="0 0.16 0" width="0.08" height="0.05" depth="0.7" color="#cccccc"></a-box>
          <a-box position="0 0.16 0" width="0.7" height="0.05" depth="0.08" color="#cccccc"></a-box>
        </a-cylinder>
