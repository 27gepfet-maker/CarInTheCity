<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VR Driving Simulator - Meta Quest 3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    #vr-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      color: #F8FAFC;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 300px;
      pointer-events: none;
    }

    #vr-hud h1 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #38BDF8;
    }

    #vr-hud p {
      margin: 4px 0;
      font-size: 12px;
      color: #94A3B8;
    }

    .hud-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      color: #64748B;
    }

    .stat-value {
      font-size: 16px;
      font-weight: bold;
      color: #FACC15;
    }

    .a-in-vr #vr-hud {
      display: none !important;
    }
  </style>

  <script>
    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, val || 0));
    }

    // Procedural canvas textures attached safely via THREE.CanvasTexture
    AFRAME.registerComponent('procedural-city-textures', {
      init: function () {
        const el = this.el;
        el.addEventListener('loaded', () => {
          // 1. Road Texture
          const roadCanvas = document.createElement('canvas');
          roadCanvas.width = 512;
          roadCanvas.height = 512;
          const rCtx = roadCanvas.getContext('2d');
          rCtx.fillStyle = '#1e293b';
          rCtx.fillRect(0, 0, 512, 512);
          rCtx.fillStyle = '#eab308';
          rCtx.fillRect(250, 0, 4, 512);
          rCtx.fillRect(258, 0, 4, 512);
          rCtx.fillStyle = '#f8fafc';
          for (let y = 0; y < 512; y += 64) {
            rCtx.fillRect(130, y + 12, 6, 32);
            rCtx.fillRect(376, y + 12, 6, 32);
          }

          // 2. Building Texture
          const bldgCanvas = document.createElement('canvas');
          bldgCanvas.width = 256;
          bldgCanvas.height = 512;
          const bCtx = bldgCanvas.getContext('2d');
          bCtx.fillStyle = '#0f172a';
          bCtx.fillRect(0, 0, 256, 512);
          for (let r = 0; r < 16; r++) {
            for (let c = 0; c < 6; c++) {
              bCtx.fillStyle = Math.random() > 0.3 ? '#38bdf8' : '#1e293b';
              bCtx.fillRect(16 + c * 38, 16 + r * 30, 24, 20);
            }
          }

          // Apply direct THREE Textures to avoid canvas loading whiteouts
          const roadPlane = document.getElementById('road-plane');
          if (roadPlane && roadPlane.getObject3D('mesh')) {
            const roadTex = new THREE.CanvasTexture(roadCanvas);
            roadTex.wrapS = THREE.RepeatWrapping;
            roadTex.wrapT = THREE.RepeatWrapping;
            roadTex.repeat.set(2, 120);
            roadPlane.getObject3D('mesh').material.map = roadTex;
            roadPlane.getObject3D('mesh').material.needsUpdate = true;
          }
        });
      }
    });

    // Procedural City Generator
    AFRAME.registerComponent('city-builder', {
      init: function () {
        const sceneEl = this.el;
        for (let z = -600; z <= 600; z += 40) {
          if (Math.abs(z) < 20) continue;
          
          const h1 = 30 + Math.random() * 40;
          const b1 = document.createElement('a-box');
          b1.setAttribute('position', `-26 ${h1 / 2} ${z}`);
          b1.setAttribute('width', '18');
          b1.setAttribute('height', h1);
          b1.setAttribute('depth', '28');
          b1.setAttribute('color', '#1e293b');
          sceneEl.appendChild(b1);

          const h2 = 30 + Math.random() * 40;
          const b2 = document.createElement('a-box');
          b2.setAttribute('position', `26 ${h2 / 2} ${z}`);
          b2.setAttribute('width', '18');
          b2.setAttribute('height', h2);
          b2.setAttribute('depth', '28');
          b2.setAttribute('color', '#0f172a');
          sceneEl.appendChild(b2);
        }
      }
    });

    // Steering wheel component (Right-Hand Drive)
    AFRAME.registerComponent('vr-steering-wheel', {
      init: function () {
        this.steeringAngle = 0;
        this.isMouseDragging = false;
        this.previousMouseX = 0;

        this.onMouseDown = this.onMouseDown.bind(this);
        this.onMouseUp = this.onMouseUp.bind(this);
        this.onMouseMove = this.onMouseMove.bind(this);

        this.el.addEventListener('mousedown', this.onMouseDown);
        window.addEventListener('mouseup', this.onMouseUp);
        window.addEventListener('mousemove', this.onMouseMove);
      },

      onMouseDown: function (evt) {
        this.isMouseDragging = true;
        this.previousMouseX = evt.clientX;
      },

      onMouseUp: function () {
        this.isMouseDragging = false;
      },

      onMouseMove: function (evt) {
        if (!this.isMouseDragging) return;
        const deltaX = evt.clientX - this.previousMouseX;
        this.previousMouseX = evt.clientX;
        this.setSteeringAngle(this.steeringAngle - deltaX * 0.75);
      },

      setSteeringAngle: function(angle) {
        this.steeringAngle = clamp(angle, -120, 120);
        this.el.setAttribute('rotation', { x: 20, y: 0, z: this.steeringAngle });

        const hudAngle = document.getElementById('hud-steering');
        if (hudAngle) hudAngle.textContent = `${Math.round(this.steeringAngle)}°`;
        const dashSteer = document.getElementById('dash-steer-text');
        if (dashSteer) dashSteer.setAttribute('value', `STEER: ${Math.round(this.steeringAngle)} DEG`);
      },

      tick: function () {
        if (!this.isMouseDragging && Math.abs(this.steeringAngle) > 0.1) {
          const autoCenter = 2.5;
          this.setSteeringAngle(this.steeringAngle > 0 ? 
            Math.max(0, this.steeringAngle - autoCenter) : 
            Math.min(0, this.steeringAngle + autoCenter));
        }
      }
    });

    // Vehicle Driving Physics
    AFRAME.registerComponent('vehicle-physics', {
      init: function () {
        this.speed = 0;
        this.throttleInput = 0;
        this.keys = {};

        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      },

      tick: function (time, timeDelta) {
        if (!timeDelta) return;
        const dt = Math.min(timeDelta / 1000, 0.1);

        this.throttleInput = 0;
        if (this.keys['KeyW'] || this.keys['ArrowUp']) this.throttleInput += 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) this.throttleInput -= 1;

        const wheelEl = document.getElementById('steering-wheel');
        const wheelComp = wheelEl ? wheelEl.components['vr-steering-wheel'] : null;

        if (wheelComp && !wheelComp.isMouseDragging) {
          if (this.keys['KeyA'] || this.keys['ArrowLeft']) wheelComp.setSteeringAngle(wheelComp.steeringAngle - 3);
          if (this.keys['KeyD'] || this.keys['ArrowRight']) wheelComp.setSteeringAngle(wheelComp.steeringAngle + 3);
        }

        if (this.throttleInput !== 0) {
          this.speed += 25 * this.throttleInput * dt;
        } else {
          this.speed = this.speed > 0 ? Math.max(0, this.speed - 8 * dt) : Math.min(0, this.speed + 8 * dt);
        }
        this.speed = clamp(this.speed, -20, 65);

        const steeringAngle = wheelComp ? wheelComp.steeringAngle : 0;
        const carRig = document.getElementById('car-rig');
        if (carRig) {
          const rot = carRig.getAttribute('rotation');
          const pos = carRig.getAttribute('position');
          const velocityMs = this.speed * 0.44704;
          const turnFactor = (steeringAngle / 120) * (velocityMs / 12) * 48 * dt;
          const newHeading = rot.y + turnFactor;
          const headingRad = newHeading * (Math.PI / 180);

          carRig.setAttribute('rotation', { x: 0, y: newHeading, z: 0 });
          carRig.setAttribute('position', {
            x: pos.x - Math.sin(headingRad) * velocityMs * dt,
            y: pos.y,
            z: pos.z - Math.cos(headingRad) * velocityMs * dt
          });
        }

        const hudSpeed = document.getElementById('hud-speed');
        if (hudSpeed) hudSpeed.textContent = `${Math.abs(Math.round(this.speed))} MPH`;
        const dashSpeed = document.getElementById('dash-speed-text');
        if (dashSpeed) dashSpeed.setAttribute('value', `${Math.abs(Math.round(this.speed))} MPH`);
      }
    });
  </script>
</head>
<body>

  <!-- 2D HUD -->
  <div id="vr-hud">
    <h1>Meta Quest 3 Driving Simulator</h1>
    <p><strong>Controls:</strong> WASD / Arrow Keys to drive. Click & drag steering wheel with mouse.</p>
    <div class="hud-stats">
      <div class="stat-card">
        <div class="stat-label">Speed</div>
        <div class="stat-value" id="hud-speed">0 MPH</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Steering</div>
        <div class="stat-value" id="hud-steering">0°</div>
      </div>
    </div>
  </div>

  <!-- A-Frame VR Scene -->
  <a-scene 
    vehicle-physics 
    city-builder 
    procedural-city-textures
    renderer="antialias: true; colorManagement: true;"
    embedded style="width: 100vw; height: 100vh;">

    <!-- Sky and Light -->
    <a-sky color="#38BDF8"></a-sky>
    <a-light type="directional" position="-10 20 10" intensity="1.0"></a-light>
    <a-light type="ambient" intensity="0.6" color="#F1F5F9"></a-light>

    <!-- Road Surface -->
    <a-plane 
      id="road-plane"
      position="0 0 0" 
      rotation="-90 0 0" 
      width="100" 
      height="1200" 
      color="#334155">
    </a-plane>

    <!-- CAR VEHICLE RIG -->
    <a-entity id="car-rig" position="0 0 0">
      
      <!-- Body Shell -->
      <a-box position="0 0.65 0" width="2.1" height="0.65" depth="4.6" color="#DC2626"></a-box>
      <a-box position="0 0.85 -1.6" width="2.0" height="0.25" depth="1.2" color="#B91C1C"></a-box>
      <a-box position="0 1.35 0.2" width="1.85" height="0.8" depth="2.2" color="#020617" material="opacity: 0.85; transparent: true;"></a-box>

      <!-- Dashboard Panel -->
      <a-box position="0 0.95 -0.8" width="1.8" height="0.35" depth="0.6" color="#1E293B"></a-box>

      <!-- Right-Hand Drive Cockpit HUD Screen -->
      <a-entity position="0.42 1.35 -0.68" rotation="10 0 0">
        <a-plane width="0.45" height="0.28" color="#0F172A"></a-plane>
        <a-text id="dash-speed-text" value="0 MPH" align="center" position="0 0.05 0.01" scale="0.35 0.35 0.35" color="#FACC15"></a-text>
        <a-text id="dash-steer-text" value="STEER: 0 DEG" align="center" position="0 -0.05 0.01" scale="0.2 0.2 0.2" color="#38BDF8"></a-text>
      </a-entity>

      <!-- Steering Wheel (Right-Hand Side) -->
      <a-entity position="0.42 1.05 -0.55">
        <a-cylinder radius="0.04" height="0.45" rotation="-20 0 0" color="#334155"></a-cylinder>
        
        <a-entity id="steering-wheel" position="0 0.18 -0.08" rotation="20 0 0" vr-steering-wheel>
          <a-torus radius="0.22" radius-tubular="0.025" color="#0F172A"></a-torus>
          <a-cylinder radius="0.06" height="0.04" rotation="90 0 0" color="#1E293B"></a-cylinder>
          <a-cylinder radius="0.025" height="0.042" rotation="90 0 0" color="#DC2626"></a-cylinder>
          <a-box width="0.03" height="0.2" depth="0.02" position="0 -0.09 0" color="#475569"></a-box>
          <a-box width="0.2" height="0.03" depth="0.02" position="-0.09 0.02 0" color="#475569"></a-box>
          <a-box width="0.2" height="0.03" depth="0.02" position="0.09 0.02 0" color="#475569"></a-box>
        </a-entity>
      </a-entity>

      <!-- Right-Hand Drive Camera (Driver Seat) -->
      <a-entity id="rig" position="0 0 0">
        <a-camera id="camera" position="0.42 1.5 -0.05" look-controls wasd-controls="enabled: false"></a-camera>
      </a-entity>

    </a-entity>

  </a-scene>
</body>
</html>
