<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VR Driving Simulator - Meta Quest 3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- A-Frame WebXR Framework -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #vr-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #F8FAFC;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      max-width: 320px;
      pointer-events: none;
    }

    #vr-hud h1 {
      margin: 0 0 6px 0;
      font-size: 18px;
      font-weight: 700;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #vr-hud p {
      margin: 4px 0;
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.4;
    }

    .hud-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748B;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: #FACC15;
    }

    /* Hide HUD when WebXR VR session starts */
    .a-in-vr #vr-hud {
      display: none !important;
    }
  </style>

  <script>
    function safeNum(val, fallback = 0) {
      return (typeof val === 'number' && !isNaN(val) && isFinite(val)) ? val : fallback;
    }

    function safeVec3(vec, fallback = {x:0, y:0, z:0}) {
      if (!vec) return fallback;
      return {
        x: safeNum(vec.x, fallback.x),
        y: safeNum(vec.y, fallback.y),
        z: safeNum(vec.z, fallback.z)
      };
    }

    function clamp(val, min, max) {
      return Math.max(min, Math.min(max, safeNum(val)));
    }

    window.addEventListener('DOMContentLoaded', () => {
      const roadCanvas = document.createElement('canvas');
      roadCanvas.width = 512;
      roadCanvas.height = 512;
      const rCtx = roadCanvas.getContext('2d');
      
      rCtx.fillStyle = '#1e293b';
      rCtx.fillRect(0, 0, 512, 512);
      
      rCtx.fillStyle = 'rgba(255,255,255,0.03)';
      for(let i = 0; i < 4000; i++) {
        rCtx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      
      rCtx.fillStyle = '#475569';
      rCtx.fillRect(0, 0, 40, 512);
      rCtx.fillRect(472, 0, 40, 512);
      
      rCtx.fillStyle = '#eab308';
      rCtx.fillRect(250, 0, 4, 512);
      rCtx.fillRect(258, 0, 4, 512);

      rCtx.fillStyle = '#f8fafc';
      for(let y = 0; y < 512; y += 64) {
        rCtx.fillRect(130, y + 12, 6, 32);
        rCtx.fillRect(376, y + 12, 6, 32);
      }

      const roadImg = document.getElementById('canvas-road');
      if (roadImg) roadImg.src = roadCanvas.toDataURL();

      const bldgCanvas = document.createElement('canvas');
      bldgCanvas.width = 256;
      bldgCanvas.height = 512;
      const bCtx = bldgCanvas.getContext('2d');

      bCtx.fillStyle = '#0f172a';
      bCtx.fillRect(0, 0, 256, 512);

      const rows = 16;
      const cols = 6;
      const wWidth = 24;
      const wHeight = 20;

      for(let r = 0; r < rows; r++) {
        for(let c = 0; c < cols; c++) {
          const x = 16 + c * 38;
          const y = 16 + r * 30;
          
          const isLit = Math.random() > 0.3;
          bCtx.fillStyle = isLit ? (Math.random() > 0.5 ? '#fde047' : '#38bdf8') : '#1e293b';
          bCtx.fillRect(x, y, wWidth, wHeight);
          
          bCtx.strokeStyle = '#020617';
          bCtx.lineWidth = 2;
          bCtx.strokeRect(x, y, wWidth, wHeight);
        }
      }

      const bldgImg = document.getElementById('canvas-building');
      if (bldgImg) bldgImg.src = bldgCanvas.toDataURL();
    });

    AFRAME.registerComponent('city-builder', {
      init: function () {
        const sceneEl = this.el;
        const blockLength = 600;
        const spacing = 40;

        for (let z = -blockLength; z <= blockLength; z += spacing) {
          if (Math.abs(z) < 15) continue; 

          const h1 = 35 + Math.random() * 45;
          const h2 = 35 + Math.random() * 45;

          const b1 = document.createElement('a-box');
          b1.setAttribute('position', `-26 ${h1 / 2} ${z}`);
          b1.setAttribute('width', '18');
          b1.setAttribute('height', h1);
          b1.setAttribute('depth', '28');
          b1.setAttribute('material', `src: #canvas-building; repeat: 2 ${Math.floor(h1 / 5)}; roughness: 0.3;`);
          sceneEl.appendChild(b1);

          const b2 = document.createElement('a-box');
          b2.setAttribute('position', `26 ${h2 / 2} ${z}`);
          b2.setAttribute('width', '18');
          b2.setAttribute('height', h2);
          b2.setAttribute('depth', '28');
          b2.setAttribute('material', `src: #canvas-building; repeat: 2 ${Math.floor(h2 / 5)}; roughness: 0.3;`);
          sceneEl.appendChild(b2);

          if (Math.abs(z) % 80 === 0) {
            this.createStreetlight(sceneEl, -13, z, 1);
            this.createStreetlight(sceneEl, 13, z, -1);
          }
        }
      },

      createStreetlight: function(scene, x, z, dir) {
        const pole = document.createElement('a-entity');
        pole.setAttribute('position', `${x} 0 ${z}`);
        pole.innerHTML = `
          <a-cylinder radius="0.12" height="7" position="0 3.5 0" color="#334155"></a-cylinder>
          <a-box width="1.5" height="0.15" depth="0.15" position="${dir * 0.6} 6.9 0" color="#334155"></a-box>
          <a-sphere radius="0.25" position="${dir * 1.2} 6.7 0" color="#fef08a" material="emissive: #fef08a; emissiveIntensity: 0.8"></a-sphere>
        `;
        scene.appendChild(pole);
      }
    });

    AFRAME.registerComponent('vr-steering-wheel', {
      init: function () {
        this.steeringAngle = 0; 
        this.grabbingHand = null;
        this.handInitialAngle = 0;
        this.wheelInitialAngle = 0;

        this.isMouseDragging = false;
        this.previousMouseX = 0;

        this.onGrabStart = this.onGrabStart.bind(this);
        this.onGrabEnd = this.onGrabEnd.bind(this);
        this.onMouseDown = this.onMouseDown.bind(this);
        this.onMouseUp = this.onMouseUp.bind(this);
        this.onMouseMove = this.onMouseMove.bind(this);
